name: validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Find changed domain files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }} -- 'domains/*.json' > changed.txt
          cat changed.txt
      - name: Validate changed files
        if: hashFiles('changed.txt') != ''
        run: |
          set -e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Validating $f"
            node util/validate.js --file "$f"
          done < changed.txt
      - name: Check per-user cap
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-cap.mjs --author "$PR_AUTHOR"
